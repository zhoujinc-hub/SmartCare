services:
  db:
    image: mysql:8.0
    container_name: smartcare-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      # 1. 数据持久化（必须！避免删容器丢数据）
      - db_data:/var/lib/mysql

      # 2. 初始化脚本（首次启动执行，仅一次）
      - ./database/init:/docker-entrypoint-initdb.d

      # 3. 备用：随时手动挂载更新文件
      - ./database/migrations:/migrations
    command: --default-authentication-plugin=mysql_native_password

  backend:
    build: ./backend
    container_name: smartcare-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - db
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: smartcare-frontend
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  db_data:
