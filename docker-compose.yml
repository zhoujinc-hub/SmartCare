services:
  db:
    image: mysql:8.0
    container_name: smartcare-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lease
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  backend:
    build: ./backend
    container_name: smartcare-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: lease
      DB_USER: root
      DB_PASSWORD: root
    depends_on:
      - db
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: smartcare-frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  db_data: