server:
  port: 8080

  spring:
    datasource:
      type: com.zaxxer.hikari.HikariDataSource
      url: jdbc:mysql://${DB_HOST:db}:${DB_PORT:3306}/${DB_NAME:lease}?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2b8
      username: ${DB_USER:root}
      password: ${DB_PASSWORD:root}
      hikari:
        connection-test-query: SELECT 1
        connection-timeout: 60000
        idle-timeout: 500000
        max-lifetime: 540000
        maximum-pool-size: 12
        minimum-idle: 10
        pool-name: SPHHikariPool

  mybatis-plus:
    configuration:
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    mapper-locations: classpath*:/mapper/**/*.xml